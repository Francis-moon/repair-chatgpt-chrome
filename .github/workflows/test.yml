name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 regression tests
        shell: powershell
        run: ./tests/Run-Tests.ps1
      - name: PowerShell 7 regression tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1
